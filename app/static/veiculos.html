<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veículos — MotoPrime</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mpg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5a0"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <path d="M8 30 L8 10 L20 24 L32 10 L32 30" stroke="url(#mpg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="32" cy="10" r="2.6" fill="#00e5a0"/>
</svg></div>
      <div class="logo-text"><span>MotoPrime</span><small>Concessionária</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="avatar">?</div>
        <div class="user-info-text">
          <div class="user-name" id="uname">—</div>
          <div class="user-role" id="urole">—</div>
        </div>
      </div>
      <button class="nav-item" onclick="logout()"><span class="ico">↩</span><span>Sair</span></button>
    </div>
  </aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Veículos</h1>
        <p class="page-sub">Estoque e disponibilidade</p>
      </div>
            <button id="btnNovo" class="btn btn-primary" onclick="openModal()">+ Novo veículo</button>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot"></span> Estoque de veículos</div>
      <div id="lista"></div>
    </div>
  </main>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="mTitle">Novo veículo</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <form id="form" onsubmit="salvar(event)">
      <div class="modal-body">
        <div class="fg"><label>Chassi (17 caracteres)</label><input id="f_chassi" maxlength="17" minlength="17" required></div>
        <div class="form-row">
          <div class="fg"><label>Marca</label><input id="f_marca" required></div>
          <div class="fg"><label>Modelo</label><input id="f_modelo" required></div>
        </div>
        <div class="form-row">
          <div class="fg"><label>Ano</label><input id="f_ano" type="number" required></div>
          <div class="fg"><label>Preço</label><input id="f_preco" type="number" step="0.01" required></div>
        </div>
        <div class="form-row">
          <div class="fg"><label>Placa</label><input id="f_placa" maxlength="8" placeholder="ABC1D23"></div>
          <div class="fg"><label>Quilometragem (km)</label><input id="f_quilometragem" type="number" value="0" min="0"></div>
        </div>
        <div class="form-row">
          <div class="fg"><label>Categoria</label>
            <select id="f_categoria" required>
              <option value="novo">Novo</option>
              <option value="usado">Usado</option>
            </select>
          </div>
          <div class="fg" id="fg_situacao" style="display:none"><label>Situação</label>
            <select id="f_situacao">
              <option value="disponivel">Disponível</option>
              <option value="vendido">Vendido</option>
              <option value="reservado">Reservado</option>
            </select>
          </div>
        </div>
        <div class="fg"><label>Descrição</label><textarea id="f_descricao"></textarea></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>
<script>
var Auth = {
  get token(){return localStorage.getItem('token')},
  get cargo(){return localStorage.getItem('cargo')},
  get nome(){return localStorage.getItem('nome')}
};
if(!Auth.token){ location.href='/'; }

async function api(path, opt){
  var headers = {'Content-Type':'application/json','Authorization':'Bearer '+Auth.token};
  var r = await fetch(path, Object.assign({}, opt, {headers: headers}));
  if(r.status===401){ localStorage.clear(); location.href='/'; return; }
  if(r.status===204) return null;
  var txt = await r.text();
  var data = txt ? JSON.parse(txt) : null;
  if(!r.ok) throw new Error((data && data.detail) || 'Erro '+r.status);
  return data;
}
function toast(m,t){var e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2800);}
function initials(n){return (n||'?').split(' ').map(function(x){return x[0]}).slice(0,2).join('').toUpperCase();}
function fmtMoney(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmtDate(d){return d ? new Date(d).toLocaleDateString('pt-BR') : '—';}
function fmtDT(d){return d ? new Date(d).toLocaleString('pt-BR') : '—';}
function fmtNum(v){return Number(v||0).toLocaleString('pt-BR');}
function logout(){ localStorage.clear(); location.href='/'; }

function buildNav(active){
  var c = Auth.cargo;
  var items = [{icon:'◈',label:'Dashboard',href:'/dashboard'}];
  var menus = [];
  if(c==='adm'){
    menus.push({icon:'◉',label:'Funcionários',href:'/funcionarios'});
    menus.push({icon:'◆',label:'Veículos',href:'/veiculos'});
    menus.push({icon:'◇',label:'Clientes',href:'/clientes'});
    menus.push({icon:'▣',label:'Transações',href:'/transacoes'});
    menus.push({icon:'⚙',label:'Ordens de Serviço',href:'/ordens'});
  } else if(c==='vendedor'){
    menus.push({icon:'◆',label:'Veículos',href:'/veiculos'});
    menus.push({icon:'◇',label:'Clientes',href:'/clientes'});
    menus.push({icon:'▣',label:'Transações',href:'/transacoes'});
  } else if(c==='oficina'){
    menus.push({icon:'◆',label:'Veículos',href:'/veiculos'});
    menus.push({icon:'⚙',label:'Ordens de Serviço',href:'/ordens'});
  }
  items = items.concat(menus);
  document.getElementById('nav').innerHTML = items.map(function(i){
    var act = (i.href === active) ? 'active' : '';
    return '<a class="nav-item '+act+'" href="'+i.href+'"><span class="ico">'+i.icon+'</span><span>'+i.label+'</span></a>';
  }).join('');
  document.getElementById('avatar').textContent = initials(Auth.nome);
  document.getElementById('uname').textContent = Auth.nome || '—';
  var roles = {adm:'Administrador',vendedor:'Vendedor',oficina:'Oficina'};
  document.getElementById('urole').textContent = roles[Auth.cargo] || Auth.cargo;
}
function closeModal(){ var o = document.getElementById('overlay'); if(o) o.classList.remove('active'); }
function openOverlay(){ var o = document.getElementById('overlay'); if(o) o.classList.add('active'); }


var editing = null, cache = [];
async function load(){
  var el = document.getElementById('lista');
  try {
    cache = await api('/veiculos/');
    if(!cache.length){
      el.innerHTML = '<div class="empty"><div class="icon">◌</div><h3>Nenhum veículo no estoque</h3></div>';
      return;
    }
    var rows = cache.map(function(v){
      var acoes = (Auth.cargo === 'adm')
        ? '<div class="actions"><button class="btn btn-warning btn-icon" onclick="editar(&quot;'+v.chassi+'&quot;)">✎</button><button class="btn btn-danger btn-icon" onclick="excluir(&quot;'+v.chassi+'&quot;)">✕</button></div>'
        : '<span style="color:var(--text-mute);font-size:11px">somente leitura</span>';
      return '<tr>'+
        '<td class="mono">'+v.chassi+'</td>'+
        '<td class="mono">'+(v.placa||'—')+'</td>'+
        '<td><strong>'+v.marca+' '+v.modelo+'</strong></td>'+
        '<td>'+v.ano+'</td>'+
        '<td>'+fmtNum(v.quilometragem)+' km</td>'+
        '<td><span class="badge badge-'+v.categoria+'">'+v.categoria+'</span></td>'+
        '<td><span class="badge badge-'+v.situacao+'">'+v.situacao+'</span></td>'+
        '<td><strong>'+fmtMoney(v.preco)+'</strong></td>'+
        '<td>'+acoes+'</td></tr>';
    }).join('');
    el.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Chassi</th><th>Placa</th><th>Veículo</th><th>Ano</th><th>KM</th><th>Categoria</th><th>Situação</th><th>Preço</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  } catch(e){
    el.innerHTML = '<div class="empty"><div class="icon">◌</div><h3>'+e.message+'</h3></div>';
  }
}
function editar(chassi){
  var v = cache.filter(function(x){return x.chassi===chassi;})[0]; if(!v) return;
  editing = chassi;
  document.getElementById('mTitle').textContent = 'Editar veículo';
  document.getElementById('f_chassi').value = v.chassi; document.getElementById('f_chassi').disabled = true;
  document.getElementById('f_marca').value = v.marca;
  document.getElementById('f_modelo').value = v.modelo;
  document.getElementById('f_ano').value = v.ano;
  document.getElementById('f_preco').value = v.preco;
  document.getElementById('f_placa').value = v.placa || '';
  document.getElementById('f_quilometragem').value = v.quilometragem || 0;
  document.getElementById('f_categoria').value = v.categoria;
  document.getElementById('f_descricao').value = v.descricao || '';
  document.getElementById('fg_situacao').style.display = 'block';
  document.getElementById('f_situacao').value = v.situacao;
  openOverlay();
}
function openModal(){
  editing = null;
  document.getElementById('form').reset();
  document.getElementById('f_chassi').disabled = false;
  document.getElementById('mTitle').textContent = 'Novo veículo';
  document.getElementById('fg_situacao').style.display = 'none';
  openOverlay();
}
async function salvar(e){
  e.preventDefault();
  var d = {
    marca: document.getElementById('f_marca').value,
    modelo: document.getElementById('f_modelo').value,
    ano: parseInt(document.getElementById('f_ano').value),
    categoria: document.getElementById('f_categoria').value,
    preco: parseFloat(document.getElementById('f_preco').value),
    placa: document.getElementById('f_placa').value || null,
    quilometragem: parseInt(document.getElementById('f_quilometragem').value || 0),
    descricao: document.getElementById('f_descricao').value || null
  };
  try {
    if(editing){
      d.situacao = document.getElementById('f_situacao').value;
      await api('/veiculos/'+editing, {method:'PUT', body: JSON.stringify(d)});
      toast('Veículo atualizado');
    } else {
      d.chassi = document.getElementById('f_chassi').value;
      await api('/veiculos/', {method:'POST', body: JSON.stringify(d)});
      toast('Veículo cadastrado');
    }
    closeModal(); load();
  } catch(err){ toast(err.message, 'error'); }
}
async function excluir(chassi){
  if(!confirm('Excluir veículo '+chassi+'?')) return;
  try { await api('/veiculos/'+chassi, {method:'DELETE'}); toast('Veículo excluído'); load(); }
  catch(err){ toast(err.message, 'error'); }
}
buildNav('/veiculos');
if(Auth.cargo !== 'adm'){ var b = document.getElementById('btnNovo'); if(b) b.style.display = 'none'; }
load();

</script>
</body>
</html>
